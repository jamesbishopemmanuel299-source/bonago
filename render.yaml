services:
  - type: web
    name: bonago-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DERIV_CLIENT_ID
        sync: false
      - key: DERIV_ACCESS_TOKEN
        sync: false
