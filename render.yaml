services:
  - type: web
    name: bonago-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DERIV_CLIENT_ID
        sync: false
      - key: DERIV_REDIRECT_URI
        value: https://bonago-1.onrender.com/auth/deriv/callback
      - key: SESSION_SECRET
        generateValue: true
