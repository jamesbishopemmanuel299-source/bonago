services:
  - type: web
    name: bonago-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DERIV_CLIENT_ID
        sync: false
      - key: DERIV_APP_ID
        sync: false
      - key: DERIV_ACCESS_TOKEN
        sync: false
      - key: DERIV_DEMO_ACCESS_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
